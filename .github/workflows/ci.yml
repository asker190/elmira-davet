name: CI Build & Lint Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: elmira-davet/package-lock.json

      - name: Install dependencies
        working-directory: ./elmira-davet
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./elmira-davet
        run: npx prisma generate

      - name: Lint check
        working-directory: ./elmira-davet
        run: npm run lint

      - name: Build Next.js
        working-directory: ./elmira-davet
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          AUTH_SECRET: test-secret-key-for-ci-build-123456
        run: npm run build
